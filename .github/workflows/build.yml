name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  controller-image:
    needs: go-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/controller
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.controller
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller

  # Publish the chart as an OCI artifact next to the controller image. These
  # charts are in no helm index, so a region's mgmt build could not install
  # them at all — kamaji-addon-konnectivity especially, whose coverage-aware
  # settings stop a 2-replica control plane leaving an apiserver replica with
  # zero agents and wedging webhooks on fresh zones.
  chart:
    needs: go-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push
        run: |
          set -Eeuo pipefail
          chart=charts/kamaji-addon-konnectivity
          ver=$(awk '/^version:/ {print $2; exit}' "$chart/Chart.yaml")
          [ -n "$ver" ] || { echo "::error::no version in $chart/Chart.yaml"; exit 1; }
          helm package "$chart" --destination /tmp
          helm push "/tmp/kamaji-addon-konnectivity-${ver}.tgz" oci://ghcr.io/stackblaze/charts
          echo "pushed oci://ghcr.io/stackblaze/charts/kamaji-addon-konnectivity:${ver}" >> "$GITHUB_STEP_SUMMARY"

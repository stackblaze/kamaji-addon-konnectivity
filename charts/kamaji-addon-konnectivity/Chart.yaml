apiVersion: v2
name: kamaji-addon-konnectivity
description: |
  Konnectivity health addon for Kamaji. Installs the management-cluster
  controller that watches TenantControlPlane CRs and, for every
  konnectivity-enabled tenant, verifies the apiserver→in-cluster tunnel
  actually serves dials and self-heals it (bouncing the konnectivity-agent
  DaemonSet) when it is up-but-wedged. Also restarts individual agents that
  stay disconnected and publishes the tunnel state on the TenantControlPlane
  for the k8s-healthz → Checkmate alert path. Pairs with kamaji-addon-ingress, which
  handles the inbound (pod/kubectl → apiserver) direction.
type: application
version: 0.3.0
appVersion: "0.3.0"
keywords:
  - kamaji
  - hosted-control-plane
  - konnectivity
  - admission-webhooks
  - self-healing
home: https://github.com/stackblaze/kamaji-addon-konnectivity
sources:
  - https://github.com/stackblaze/kamaji-addon-konnectivity
maintainers:
  - name: Dean Kamali
    email: dean.kamali@gmail.com

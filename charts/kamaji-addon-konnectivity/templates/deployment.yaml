apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kamaji-addon-konnectivity.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kamaji-addon-konnectivity.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kamaji-addon-konnectivity.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kamaji-addon-konnectivity.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kamaji-addon-konnectivity.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElection.enabled }}
            - --leader-election-id={{ .Values.leaderElection.id }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --verify-interval={{ .Values.verify.interval }}
            - --recheck-interval={{ .Values.verify.recheckInterval }}
            - --bounce-cooldown={{ .Values.verify.bounceCooldown }}
            - --probe-timeout={{ .Values.verify.probeTimeout }}
            - --probe-rounds={{ .Values.verify.probeRounds }}
            - --unhealthy-threshold={{ .Values.verify.unhealthyThreshold }}
            - --server-metrics-port={{ .Values.verify.serverMetricsPort }}
            - --coverage-timeout={{ .Values.verify.coverageTimeout }}
            - --manage-agents={{ .Values.agents.manage }}
            {{- with .Values.agents.onlyTenants }}
            - --manage-agents-tenants={{ join "," . }}
            {{- end }}
            - --agent-restart-after={{ .Values.agents.restartAfter }}
            - --agent-check-interval={{ .Values.agents.checkInterval }}
            {{- with .Values.extraArgs }}{{ toYaml . | nindent 12 }}{{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: probes
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]

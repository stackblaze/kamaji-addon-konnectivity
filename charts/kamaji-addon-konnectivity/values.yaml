# Default values for kamaji-addon-konnectivity controller (management cluster).

image:
  repository: ghcr.io/stackblaze/kamaji-addon-konnectivity/controller
  tag: ""        # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: ghcr-pull

replicaCount: 2

leaderElection:
  enabled: true
  id: kamaji-addon-konnectivity.stackblaze.com

# Tunnel verification + self-heal tuning. These map 1:1 to controller flags.
verify:
  # Re-verify a healthy tunnel after this interval.
  interval: 3m
  # Re-verify after a remediation or a transient (apiserver-unreachable) failure.
  recheckInterval: 30s
  # Minimum time between agent-DaemonSet bounces for the same tenant — stops a
  # genuinely-broken cluster from being restarted in a tight loop.
  bounceCooldown: 5m
  # Per-call timeout for a tunnel dial probe; a wedged dial otherwise hangs ~30s.
  probeTimeout: 10s
  # How many rounds to probe every node (covers both round-robined apiserver replicas).
  probeRounds: 3
  # Consecutive unhealthy verdicts required before bouncing the agents. The agent
  # connection set churns (agents re-dial through a single VIP fronting N servers),
  # so an isolated probe can catch a sub-second blip that clears on its own by the
  # next recheck — and bouncing on that lone blip restarts the whole DaemonSet at
  # once, a real (worse) coverage gap. Requiring the unhealth to persist across
  # rechecks debounces churn while still healing a genuine wedge within
  # unhealthyThreshold*recheckInterval. 1 = bounce on first failure (old behaviour).
  unhealthyThreshold: 2
  # konnectivity-server admin port that serves /metrics — scraped per control-plane
  # replica to verify each server has agent coverage (the HA coverage check).
  serverMetricsPort: 8133
  # Per-server /metrics scrape timeout for the coverage check.
  coverageTimeout: 5s

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Spread replicas across nodes when possible.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: kamaji-addon-konnectivity

serviceAccount:
  create: true
  name: ""        # defaults to the release name when empty

rbac:
  create: true

# Extra controller flags (e.g. --zap-log-level=debug).
extraArgs: []
